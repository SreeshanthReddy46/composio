[project]
name = "composio-app-research"
version = "0.1.0"
description = "Composio 100-app toolkit-buildability research agent + case-study page"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "pandas>=2.2.0",
    "composio-core>=0.6.0",
    "google-genai>=0.1.1",
    "trafilatura>=1.8.0",
    "playwright>=1.43.0",
    "tenacity>=8.2.3",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

